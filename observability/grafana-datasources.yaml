apiVersion: 1
datasources:
  # ── Local region (default) ─────────────────────────────────────────────────
  - name: Prometheus-local
    type: prometheus
    access: proxy
    url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Loki-local
    type: loki
    access: proxy
    url: http://loki.monitoring.svc:3100

  - name: Tempo-local
    type: tempo
    access: proxy
    url: http://tempo.monitoring.svc:3100
    jsonData:
      tracesToLogs:
        datasourceUid: loki-local
        tags: ["job", "instance", "pod", "namespace"]
      serviceMap:
        datasourceUid: prometheus-local

  # ── Cross-region Prometheus (single-pane-of-glass) ─────────────────────────
  # These URLs are ELB endpoints created by the Prometheus Helm chart.
  # Replace with actual ELB hostnames after first deploy, or use Grafana Agent
  # remote_write to centralise metrics in one region.
  - name: Prometheus-ap-southeast-1
    type: prometheus
    access: proxy
    url: http://${APS1_PROMETHEUS_ELB:-prometheus-kube-prometheus-prometheus.monitoring.svc:9090}
    jsonData:
      timeInterval: "15s"
      customQueryParameters: "region=ap-southeast-1"

  - name: Prometheus-eu-west-1
    type: prometheus
    access: proxy
    url: http://${EUW1_PROMETHEUS_ELB:-prometheus-kube-prometheus-prometheus.monitoring.svc:9090}
    jsonData:
      timeInterval: "15s"
      customQueryParameters: "region=eu-west-1"

  - name: Prometheus-us-east-1
    type: prometheus
    access: proxy
    url: http://${USE1_PROMETHEUS_ELB:-prometheus-kube-prometheus-prometheus.monitoring.svc:9090}
    jsonData:
      timeInterval: "15s"
      customQueryParameters: "region=us-east-1"
