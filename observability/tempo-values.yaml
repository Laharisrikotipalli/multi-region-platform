# tempo-values.yaml
# Deploys Grafana Tempo for distributed tracing.
# The app ships traces via OpenTelemetry → OTLP → Tempo.
tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
