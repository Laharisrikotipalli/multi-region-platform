apiVersion: v1
kind: Service
metadata:
  name: multi-region-app
  namespace: multi-region
  annotations:
    # AWS Load Balancer Controller – expose via AWS ELB
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: multi-region-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
