apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-region-app
  namespace: multi-region
  labels:
    app: multi-region-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-region-app
  template:
    metadata:
      labels:
        app: multi-region-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: app
          image: laharisri/multi-region-app:v2
          ports:
            - containerPort: 8000
          env:
            # CLUSTER_REGION is substituted by envsubst in the deploy script.
            # topology.kubernetes.io/region is a node label, not a pod annotation,
            # so fieldRef cannot read it — inject the value statically per cluster.
            - name: AWS_REGION
              value: "${CLUSTER_REGION}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
            - name: OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"