apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: multi-region
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        # ScheduleAnyway — with only 2 nodes and 3 replicas a strict DoNotSchedule
        # constraint can never be satisfied, causing Pending pods indefinitely.
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: webapp
      containers:
      - name: app
        image: laharisri/multi-region-app:v3
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: redis-url
        - name: AWS_REGION
          # Per-cluster ConfigMap created by scripts/deploy.sh / submission.yml at deploy
          # time (one per region) — NOT hardcoded, since this same manifest is applied
          # identically to all three regional clusters via ArgoCD.
          valueFrom:
            configMapKeyRef:
              name: cluster-config
              key: aws-region
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: multi-region
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
  - port: 80
    targetPort: 8000