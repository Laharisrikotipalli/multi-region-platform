commands:
  deploy:
    description: "Deploys all multi-region AWS infrastructure (EKS, RDS, Redis, Route53, Lambda) and bootstraps ArgoCD + observability stack across ap-southeast-1, eu-west-1, and us-east-1."
    script: |
      set -e
      : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
      : "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}"
      : "${TF_VAR_db_password:?TF_VAR_db_password is required}"
      : "${TF_VAR_alert_email:?TF_VAR_alert_email is required}"
      export AWS_DEFAULT_REGION=ap-southeast-1

      # ── build Lambda zip ──────────────────────────────────────────────────
      echo "=== Building Lambda zip ==="
      cd lambda
      zip -j lambda_function.zip lambda_function.py
      cd ..
      echo "Lambda zip built"

      # ── terraform: primary region first ──────────────────────────────────
      echo "=== Terraform: ap-southeast-1 (primary) ==="
      cd terraform/envs/ap-southeast-1
      terraform init -input=false -reconfigure
      terraform apply -auto-approve -input=false
      PRIMARY_DB_ARN=$(terraform output -raw rds_arn 2>/dev/null || echo "")
      cd ../../..

      # ── terraform: replica regions ────────────────────────────────────────
      for env in eu-west-1 us-east-1; do
        echo "=== Terraform: $env ==="
        cd terraform/envs/$env
        terraform init -input=false -reconfigure
        terraform apply -auto-approve -input=false \
          -var="primary_db_arn=${PRIMARY_DB_ARN}" 2>/dev/null || \
        terraform apply -auto-approve -input=false
        cd ../../..
      done

      # ── kubeconfig for all 3 clusters ────────────────────────────────────
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1

      # ── deploy to each cluster ────────────────────────────────────────────
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      helm repo add grafana              https://grafana.github.io/helm-charts             --force-update
      helm repo update

      for KC in /tmp/kc-aps1 /tmp/kc-euw1 /tmp/kc-use1; do
        export KUBECONFIG=$KC
        case $KC in
          */kc-aps1) CLUSTER_REGION=ap-southeast-1 ;;
          */kc-euw1) CLUSTER_REGION=eu-west-1 ;;
          */kc-use1) CLUSTER_REGION=us-east-1 ;;
        esac
        echo "=== Deploying to $CLUSTER_REGION ==="

        kubectl create namespace argocd       --dry-run=client -o yaml | kubectl apply -f -
        kubectl create namespace monitoring   --dry-run=client -o yaml | kubectl apply -f -
        kubectl create namespace multi-region --dry-run=client -o yaml | kubectl apply -f -

        # ArgoCD
        kubectl apply -n argocd \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        kubectl create -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/applicationset-crd.yaml 2>/dev/null || true
        kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
        kubectl apply -f k8s/argocd-application.yaml

        # Webapp (nginx with /health endpoint)
        kubectl apply -f k8s/app/deployment.yaml
        kubectl rollout status deployment/webapp -n multi-region --timeout=3m

        # Observability
        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          -n monitoring --create-namespace \
          --set grafana.adminPassword="${GRAFANA_PASSWORD}" \
          --set grafana.service.type=LoadBalancer \
          --set alertmanager.enabled=false \
          --timeout=8m

        helm upgrade --install loki  grafana/loki-stack  -n monitoring \
          --set grafana.enabled=false --timeout=5m

        helm upgrade --install tempo grafana/tempo -n monitoring --timeout=5m

        kubectl apply -f k8s/monitoring/jaeger.yaml

        # Grafana cross-region datasources
        kubectl create configmap grafana-datasources \
          --from-file=datasources.yaml=observability/grafana-datasources.yaml \
          -n monitoring --dry-run=client -o yaml | kubectl apply -f -
      done

      # ── Lambda failover function ──────────────────────────────────────────
      echo "=== Deploying Lambda failover ==="
      ROLE_ARN=$(aws iam get-role --role-name multi-region-failover-role \
        --query "Role.Arn" --output text 2>/dev/null || echo "")
      if [ -z "$ROLE_ARN" ]; then
        aws iam create-role \
          --role-name multi-region-failover-role \
          --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        aws iam attach-role-policy --role-name multi-region-failover-role \
          --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        aws iam attach-role-policy --role-name multi-region-failover-role \
          --policy-arn arn:aws:iam::aws:policy/AmazonRDSFullAccess
        aws iam attach-role-policy --role-name multi-region-failover-role \
          --policy-arn arn:aws:iam::aws:policy/AmazonRoute53FullAccess
        aws iam attach-role-policy --role-name multi-region-failover-role \
          --policy-arn arn:aws:iam::aws:policy/AmazonSNSFullAccess
        sleep 15
        ROLE_ARN=$(aws iam get-role --role-name multi-region-failover-role \
          --query "Role.Arn" --output text)
      fi

      HOSTED_ZONE_ID=$(aws route53 list-hosted-zones \
        --query "HostedZones[?Name=='multi-region-platform.internal.'].Id" \
        --output text | sed 's|/hostedzone/||')

      aws lambda delete-function --function-name multi-region-failover \
        --region ap-southeast-1 2>/dev/null || true
      sleep 5
      aws lambda create-function \
        --function-name multi-region-failover \
        --runtime python3.12 \
        --role "$ROLE_ARN" \
        --handler lambda_function.lambda_handler \
        --zip-file fileb://lambda/lambda_function.zip \
        --timeout 300 \
        --region ap-southeast-1 \
        --environment "Variables={PRIMARY_REGION=ap-southeast-1,REPLICA_REGION=eu-west-1,REPLICA_DB_IDENTIFIER=mr-postgres-replica-euw1,HOSTED_ZONE_ID=${HOSTED_ZONE_ID}}"

      echo "=== Deploy complete: all 3 regions ==="

  verify:
    description: "Verifies health and correct routing across all regions."
    script: |
      set -e
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1 2>/dev/null || true
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1 2>/dev/null || true
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1 2>/dev/null || true

      FAIL=0

      for KC in /tmp/kc-aps1 /tmp/kc-euw1 /tmp/kc-use1; do
        export KUBECONFIG=$KC
        REGION=$(echo $KC | sed 's|/tmp/kc-||')
        echo "=== Cluster: $REGION ==="
        kubectl get nodes
        NOT_RUNNING=$(kubectl get pods -n multi-region --field-selector='status.phase!=Running' \
          --no-headers 2>/dev/null | grep -v "Completed" | wc -l)
        if [ "$NOT_RUNNING" -gt 0 ]; then
          echo "ERROR: $NOT_RUNNING pod(s) not Running in $REGION"
          kubectl get pods -n multi-region
          FAIL=1
        else
          echo "OK: all pods Running in $REGION"
        fi
      done

      # HTTP 200 check on all 3 regional ELBs
      for KC_PAIR in "aps1:/tmp/kc-aps1" "euw1:/tmp/kc-euw1" "use1:/tmp/kc-use1"; do
        REGION="${KC_PAIR%%:*}"; KC="${KC_PAIR##*:}"
        ELB=$(KUBECONFIG=$KC kubectl get svc webapp -n multi-region \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -z "$ELB" ]; then
          echo "FAIL: $REGION — could not get ELB hostname"
          FAIL=1
          continue
        fi
        CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ELB}/health" || echo "000")
        if [ "$CODE" = "200" ]; then
          echo "OK: $REGION /health → HTTP $CODE"
        else
          echo "FAIL: $REGION /health → HTTP $CODE (ELB: $ELB)"
          FAIL=1
        fi
      done

      # Lambda health check
      aws lambda invoke \
        --function-name multi-region-failover \
        --region ap-southeast-1 \
        --payload '{"action":"health_check"}' \
        --cli-binary-format raw-in-base64-out \
        /tmp/lambda-verify.json 2>/dev/null && \
        echo "Lambda health: $(cat /tmp/lambda-verify.json)" || \
        echo "Lambda invoke skipped"

      if [ "$FAIL" -ne 0 ]; then
        echo "=== VERIFY FAILED — see errors above ==="
        exit 1
      fi
      echo "=== VERIFY PASSED — all 3 regions healthy ==="

  test-failover:
    description: "Simulates ap-southeast-1 regional failure, verifies traffic reroutes to euw1 and use1, then restores."
    script: |
      set -e
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1 2>/dev/null || true
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1 2>/dev/null || true
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1 2>/dev/null || true

      EUW1_ELB=$(KUBECONFIG=/tmp/kc-euw1 kubectl get svc webapp -n multi-region \
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
      USE1_ELB=$(KUBECONFIG=/tmp/kc-use1 kubectl get svc webapp -n multi-region \
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

      # Pre-check baseline
      echo "=== Pre-failover baseline ==="
      for ENTRY in "euw1|$EUW1_ELB" "use1|$USE1_ELB"; do
        REGION="${ENTRY%%|*}"; ELB="${ENTRY##*|}"
        CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ELB}/health" || echo "000")
        echo "Baseline $REGION: HTTP $CODE"
      done

      # Simulate failure
      echo "=== Simulating ap-southeast-1 failure ==="
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment webapp -n multi-region --replicas=0
      echo "Scaled webapp to 0 in ap-southeast-1"

      # Trigger Lambda failover
      echo "=== Triggering Lambda failover ==="
      aws lambda invoke \
        --function-name multi-region-failover \
        --region ap-southeast-1 \
        --payload '{"action":"failover","target_region":"eu-west-1"}' \
        --cli-binary-format raw-in-base64-out \
        /tmp/failover-response.json 2>/dev/null && \
        echo "Failover response: $(cat /tmp/failover-response.json)" || \
        echo "Lambda invoke skipped"

      # Wait for Route 53 health checks to detect failure
      echo "=== Waiting 60s for Route 53 health checks ==="
      sleep 60

      # Verify euw1 + use1 still healthy
      echo "=== Post-failover verification ==="
      FAIL=0
      for ENTRY in "euw1|$EUW1_ELB" "use1|$USE1_ELB"; do
        REGION="${ENTRY%%|*}"; ELB="${ENTRY##*|}"
        CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ELB}/health" || echo "000")
        if [ "$CODE" = "200" ]; then
          echo "OK: $REGION still serving HTTP $CODE after aps1 failure"
        else
          echo "FAIL: $REGION returned HTTP $CODE"
          FAIL=1
        fi
      done

      # Restore aps1
      echo "=== Restoring ap-southeast-1 ==="
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment webapp -n multi-region --replicas=3
      KUBECONFIG=/tmp/kc-aps1 kubectl rollout status deployment/webapp -n multi-region --timeout=3m
      echo "ap-southeast-1 restored"

      if [ "$FAIL" -ne 0 ]; then
        echo "=== FAILOVER TEST FAILED ==="
        exit 1
      fi
      echo "=== FAILOVER TEST PASSED — traffic rerouted successfully ==="

  destroy:
    description: "Destroys all provisioned cloud infrastructure across all three regions."
    script: |
      export AWS_DEFAULT_REGION=ap-southeast-1
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1 2>/dev/null || true
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1 2>/dev/null || true
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1 2>/dev/null || true

      aws lambda delete-function --function-name multi-region-failover \
        --region ap-southeast-1 2>/dev/null || true

      for env in us-east-1 eu-west-1 ap-southeast-1; do
        echo "=== Destroying: $env ==="
        cd terraform/envs/$env
        terraform destroy -auto-approve -input=false || true
        cd ../../..
      done

      echo "=== Destroy complete ==="