commands:
  deploy:
    description: "Deploys all multi-region AWS infrastructure (EKS, RDS, Redis, Route53, Lambda) and bootstraps ArgoCD + observability stack across ap-southeast-1, eu-west-1, and us-east-1."
    script: |
      set -e
      : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
      : "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}"
      : "${DATABASE_URL:?DATABASE_URL is required}"
      : "${REDIS_URL:?REDIS_URL is required}"
      export AWS_DEFAULT_REGION=ap-southeast-1

      # ── build Lambda zip ──────────────────────────────────────────────────
      echo "=== Building Lambda zip ==="
      cd lambda
      pip install boto3 --target ./package --quiet
      cp lambda_function.py ./package/
      cd package && zip -r ../failover.zip . -q && cd ..
      rm -rf package
      cd ..
      echo "Lambda zip built: $(ls -lh lambda/failover.zip)"

      # ── terraform: primary region first ──────────────────────────────────
      echo "=== Terraform: ap-southeast-1 (primary) ==="
      cd terraform/envs/ap-southeast-1
      terraform init -input=false
      terraform apply -auto-approve -input=false
      PRIMARY_DB_ARN=$(terraform output -raw primary_db_arn)
      GLOBAL_REDIS_ID=$(terraform output -raw global_replication_group_id)
      cd ../../..

      # ── terraform: replica regions ────────────────────────────────────────
      for env in eu-west-1 us-east-1; do
        echo "=== Terraform: $env ==="
        cd terraform/envs/$env
        terraform init -input=false
        terraform apply -auto-approve -input=false
        cd ../../..
      done

      # ── kubeconfig for all 3 clusters ─────────────────────────────────────
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1

      # ── deploy to each cluster ────────────────────────────────────────────
      for KC in /tmp/kc-aps1 /tmp/kc-euw1 /tmp/kc-use1; do
        export KUBECONFIG=$KC
        case $KC in
          */kc-aps1) CLUSTER_REGION=ap-southeast-1 ;;
          */kc-euw1) CLUSTER_REGION=eu-west-1 ;;
          */kc-use1) CLUSTER_REGION=us-east-1 ;;
        esac
        echo "=== Deploying to $CLUSTER_REGION ==="

        kubectl create namespace argocd       --dry-run=client -o yaml | kubectl apply -f -
        kubectl create namespace monitoring   --dry-run=client -o yaml | kubectl apply -f -
        kubectl create namespace multi-region --dry-run=client -o yaml | kubectl apply -f -

        kubectl create secret generic app-secrets -n multi-region \
          --from-literal=database-url="${DATABASE_URL}" \
          --from-literal=redis-url="${REDIS_URL}" \
          --dry-run=client -o yaml | kubectl apply -f -

        # ArgoCD
        kubectl apply -n argocd \
          -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
        kubectl apply -f k8s/argocd/argocd-application.yaml

        # Network policies
        kubectl apply -f k8s/network-policies/

        # App manifests
        CLUSTER_REGION=$CLUSTER_REGION envsubst < k8s/app/app-deployment.yaml | kubectl apply -f -
        kubectl apply -f k8s/app/app-service.yaml
        kubectl apply -f k8s/app/deployment.yaml

        # Helm repos
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
        helm repo add grafana              https://grafana.github.io/helm-charts             --force-update
        helm repo update

        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          -n monitoring --create-namespace \
          --set grafana.adminPassword="${GRAFANA_PASSWORD}" \
          --wait --timeout=5m

        helm upgrade --install loki  grafana/loki-stack  -n monitoring --set grafana.enabled=false --wait --timeout=5m
        helm upgrade --install tempo grafana/tempo        -n monitoring --wait --timeout=5m

        kubectl apply -f k8s/monitoring/jaeger.yaml
        kubectl apply -f k8s/monitoring/app-servicemonitor.yaml

        kubectl rollout status deployment/webapp           -n multi-region --timeout=3m
        kubectl rollout status deployment/multi-region-app -n multi-region --timeout=3m
      done
      echo "=== Deploy complete: all 3 regions ==="

  verify:
    description: "Verifies health and correct routing across all regions. Checks /health endpoint (PostgreSQL + Redis), pod status, and Lambda."
    script: |
      set -e
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1 2>/dev/null || true
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1 2>/dev/null || true
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1 2>/dev/null || true

      FAIL=0

      for KC in /tmp/kc-aps1 /tmp/kc-euw1 /tmp/kc-use1; do
        export KUBECONFIG=$KC
        REGION=$(echo $KC | sed 's|/tmp/kc-||')
        echo "=== Cluster: $REGION ==="
        kubectl get nodes
        NOT_RUNNING=$(kubectl get pods -n multi-region --field-selector='status.phase!=Running' \
          --no-headers 2>/dev/null | grep -v "Completed" | wc -l)
        if [ "$NOT_RUNNING" -gt 0 ]; then
          echo "ERROR: $NOT_RUNNING pod(s) not Running in $REGION"
          kubectl get pods -n multi-region
          FAIL=1
        else
          echo "OK: all pods Running in $REGION"
        fi
      done

      # Check /health on multi-region-app (DB + Redis aware)
      for KC_PAIR in "aps1:/tmp/kc-aps1" "euw1:/tmp/kc-euw1" "use1:/tmp/kc-use1"; do
        REGION="${KC_PAIR%%:*}"; KC="${KC_PAIR##*:}"
        ELB=$(KUBECONFIG=$KC kubectl get svc multi-region-app -n multi-region \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -z "$ELB" ]; then
          # Fallback to webapp svc
          ELB=$(KUBECONFIG=$KC kubectl get svc webapp -n multi-region \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        fi
        CODE=$(curl -s -o /tmp/health-${REGION}.json -w "%{http_code}" --max-time 10 "http://${ELB}/health" || echo "000")
        if [ "$CODE" = "200" ]; then
          echo "OK: $REGION /health → 200 ($(cat /tmp/health-${REGION}.json))"
        else
          echo "FAIL: $REGION /health → $CODE"
          FAIL=1
        fi
      done

      # Lambda health check
      aws lambda invoke \
        --function-name promote-replica \
        --region ap-southeast-1 \
        --payload '{"action":"health_check"}' \
        --cli-binary-format raw-in-base64-out \
        /tmp/verify-response.json 2>/dev/null || true
      echo "Lambda response: $(cat /tmp/verify-response.json 2>/dev/null || echo 'not invoked')"

      if [ "$FAIL" -ne 0 ]; then
        echo "=== VERIFY FAILED ==="
        exit 1
      fi
      echo "=== VERIFY PASSED — all 3 regions healthy ==="

  test-failover:
    description: "Simulates regional failure in ap-southeast-1 by scaling multi-region-app to 0. Verifies Route53 reroutes traffic to healthy regions within 120s. Restores region after test."
    script: |
      set -e
      : "${ROUTE53_FQDN:?Set ROUTE53_FQDN}"

      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1

      # Pre-check: all regions healthy
      PRE=$(curl -sS --max-time 10 "https://${ROUTE53_FQDN}/health" \
        | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "unknown")
      echo "Pre-failover status: $PRE"
      [ "$PRE" = "ok" ] || { echo "Pre-failover health check failed"; exit 1; }

      # Simulate failure — scale BOTH deployments to 0
      echo "=== Simulating ap-southeast-1 failure ==="
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment multi-region-app -n multi-region --replicas=0
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment webapp             -n multi-region --replicas=0
      echo "Scaled ap-southeast-1 to 0 replicas"

      # Wait for Route53 rerouting
      ELAPSED=0; REROUTED=false
      while [ $ELAPSED -lt 120 ]; do
        sleep 10; ELAPSED=$((ELAPSED+10))
        REGION=$(curl -sS --max-time 5 "https://${ROUTE53_FQDN}/info" 2>/dev/null \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('region','unknown'))" 2>/dev/null \
          || echo "unknown")
        HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "https://${ROUTE53_FQDN}/health" || echo "000")
        echo "Elapsed: ${ELAPSED}s | HTTP: $HTTP | Region: $REGION"
        if [ "$HTTP" = "200" ] && [ "$REGION" != "ap-southeast-1" ] && [ "$REGION" != "unknown" ]; then
          echo "✓ Traffic rerouted to $REGION after ${ELAPSED}s"
          REROUTED=true
          break
        fi
      done

      # Always restore
      echo "=== Restoring ap-southeast-1 ==="
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment multi-region-app -n multi-region --replicas=3
      KUBECONFIG=/tmp/kc-aps1 kubectl scale deployment webapp             -n multi-region --replicas=3
      KUBECONFIG=/tmp/kc-aps1 kubectl rollout status deployment/multi-region-app -n multi-region --timeout=120s
      echo "ap-southeast-1 restored"

      [ "$REROUTED" = "true" ] || { echo "FAILOVER TEST FAILED — traffic not rerouted within 120s"; exit 1; }
      echo "=== FAILOVER TEST PASSED — rerouted in ${ELAPSED}s ==="

  destroy:
    description: "Destroys all provisioned cloud infrastructure across all three regions."
    script: |
      export AWS_DEFAULT_REGION=ap-southeast-1
      aws eks update-kubeconfig --region ap-southeast-1 --name mr-eks-aps1 --kubeconfig /tmp/kc-aps1 2>/dev/null || true
      aws eks update-kubeconfig --region eu-west-1      --name mr-eks-euw1 --kubeconfig /tmp/kc-euw1 2>/dev/null || true
      aws eks update-kubeconfig --region us-east-1      --name mr-eks-use1 --kubeconfig /tmp/kc-use1 2>/dev/null || true

      aws lambda delete-function --function-name promote-replica \
        --region ap-southeast-1 2>/dev/null || true

      for env in us-east-1 eu-west-1 ap-southeast-1; do
        echo "=== Destroying: $env ==="
        cd terraform/envs/$env
        terraform destroy -auto-approve -input=false || true
        cd ../../..
      done
      echo "=== Destroy complete ==="
